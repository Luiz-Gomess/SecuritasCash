<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Transações da Conta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-dark mb-4">Transações da Conta <span th:text="${conta.numero}">0000-0</span></h2>

        <table class="table table-hover table-bordered shadow-sm bg-white">
            <thead class="table-dark text-center">
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Ações</th> <!-- Nova coluna -->
                </tr>
            </thead>
            <tbody>
                <tr th:each="transacao : ${transacoes}" class="text-center">
                    <td th:text="${transacao.data}">01/01/2024</td>
                    <td th:text="${transacao.descricao}">Salário</td>
                    <td th:text="${#numbers.formatDecimal(transacao.valor, 1, 'COMMA', 2, 'POINT')}">1000.00</td>
                    <td>
                        <a th:href="@{'/contas/' + ${contaId} + '/transacoes/' + ${transacao.id} + '/comentarios'}"
                        class="btn btn-outline-primary btn-sm">
                        Ver Comentários
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between">
            <a th:href="@{'/contas'}" class="btn btn-secondary">Voltar</a>
            <a th:href="@{'/contas/' + ${conta.id} + '/transacoes/criar'}" class="btn btn-success">Adicionar Transação</a>
        </div>
    </div>
</body>

</html>
