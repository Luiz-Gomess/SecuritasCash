<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Transação</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">Nova Transação</h2>

    <form th:action="@{/contas/{id}/transacoes}" th:object="${transacaoForm}" method="post">

        <!-- Campo oculto com o ID da conta -->
        <input type="hidden" name="contaId" th:value="${contaId}" />

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" class="form-control" th:field="*{descricao}" id="descricao" required />
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" class="form-control" th:field="*{valor}" step="0.01" id="valor" required />
        </div>

        <div class="mb-3">
            <label for="data" class="form-label">Data</label>
            <input type="date" class="form-control" th:field="*{data}" id="data" required />
        </div>

        <button type="submit" class="btn btn-success">Salvar Transação</button>
        <a th:href="@{/contas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
